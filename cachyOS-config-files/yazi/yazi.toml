# ~/.config/yazi/yazi.toml

[opener]
edit = [
    { run = '${EDITOR:-nvim} "$@"', block = true, desc = "Edit" },
]
open = [
    { run = 'xdg-open "$@"', orphan = true, desc = "Open" },
]
reveal = [
    { run = 'xdg-open "$(dirname "$1")"', orphan = true, desc = "Reveal in Files" },
]
fallback = [
    { run = 'xdg-open "$@"', orphan = true, desc = "Open" },
]
image = [
    { run = 'gwenview "$@"', orphan = true, desc = "View in Gwenview" },
]
play = [
    { run = 'mpv "$@"', orphan = true, desc = "Play in mpv" },
]
music = [
    { run = '~/.config/yazi/play_music.sh "$@"', orphan = true, desc = "Play Music" },
]
pdf = [
    { run = 'okular "$@"', orphan = true, desc = "Open in Okular" },
]
office = [
    { run = 'libreoffice "$@"', orphan = true, desc = "Open in LibreOffice" },
]
web = [
    { run = 'xdg-open "$@"', orphan = true, desc = "Open in Browser" },
]
archive = [
    { run = 'ark "$@"', orphan = true, desc = "Open in Ark" },
]

[open]
rules = [
    { name = "*/", use = ["edit", "open", "reveal"] },

    #media
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "music" },
    { mime = "image/*", use = "image" },

    #documents
    { mime = "application/pdf", use = "pdf" },
    { name = "*.odt",  use = "office" },
    { name = "*.docx", use = "office" },
    { name = "*.xlsx", use = "office" },
    { name = "*.pptx", use = "office" },
    { name = "*.ods",  use = "office" },
    { name = "*.odp",  use = "office" },

    #web
    { name = "*.html", use = "web" },
    { name = "*.htm",  use = "web" },

    #archives
    { mime = "application/zip",             use = "archive" },
    { mime = "application/gzip",            use = "archive" },
    { mime = "application/x-tar",           use = "archive" },
    { mime = "application/x-bzip2",         use = "archive" },
    { mime = "application/x-xz",            use = "archive" },
    { mime = "application/x-7z-compressed", use = "archive" },
    { mime = "application/x-rar",           use = "archive" },
    { mime = "application/zstd",            use = "archive" },
    { name = "*.zip", use = "archive" },
    { name = "*.tar", use = "archive" },
    { name = "*.gz",  use = "archive" },
    { name = "*.zst", use = "archive" },
    { name = "*.7z",  use = "archive" },
    { name = "*.rar", use = "archive" },

    #config and data formats
    { name = "*.json",  use = "edit" },
    { name = "*.jsonc", use = "edit" },
    { name = "*.toml",  use = "edit" },
    { name = "*.yaml",  use = "edit" },
    { name = "*.yml",   use = "edit" },
    { name = "*.xml",   use = "edit" },
    { name = "*.ini",   use = "edit" },
    { name = "*.conf",  use = "edit" },
    { name = "*.env",   use = "edit" },
    { name = "*.lua",   use = "edit" },

    #git files
    { name = ".gitignore",  use = "edit" },
    { name = ".gitconfig",  use = "edit" },
    { name = ".gitmodules", use = "edit" },

    #build systems
    { name = "CMakeLists.txt", use = "edit" },
    { name = "*.cmake",        use = "edit" },
    { name = "Makefile",       use = "edit" },
    { name = "Justfile",       use = "edit" },
    { name = "Dockerfile",     use = "edit" },
    { name = "*.dockerfile",   use = "edit" },
    { name = "*.nix",          use = "edit" },

    #programming languages
    { name = "*.c",      use = "edit" },
    { name = "*.cpp",    use = "edit" },
    { name = "*.h",      use = "edit" },
    { name = "*.hpp",    use = "edit" },
    { name = "*.rs",     use = "edit" },
    { name = "*.go",     use = "edit" },
    { name = "*.java",   use = "edit" },
    { name = "*.kt",     use = "edit" },
    { name = "*.py",     use = "edit" },
    { name = "*.rb",     use = "edit" },
    { name = "*.js",     use = "edit" },
    { name = "*.ts",     use = "edit" },
    { name = "*.jsx",    use = "edit" },
    { name = "*.tsx",    use = "edit" },
    { name = "*.css",    use = "edit" },
    { name = "*.scss",   use = "edit" },
    { name = "*.vue",    use = "edit" },
    { name = "*.svelte", use = "edit" },
    { name = "*.md",     use = "edit" },
    { name = "*.mdx",    use = "edit" },

    #shell scripts
    { name = "*.sh",   use = "edit" },
    { name = "*.zsh",  use = "edit" },
    { name = "*.bash", use = "edit" },
    { name = "*.fish", use = "edit" },

    #fallback for other text files
    { mime = "text/*",                    use = "edit" },
    { mime = "application/json",          use = "edit" },
    { mime = "application/javascript",    use = "edit" },
    { mime = "application/x-shellscript", use = "edit" },
    { mime = "empty",                     use = "edit" },
    { name = "*", use = "fallback" },
]

[manager]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true

[preview]
tab_size      = 2
max_width     = 1200
max_height    = 900
cache_dir     = ""
image_filter  = "triangle"
image_quality = 75
