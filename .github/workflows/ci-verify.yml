name: Config Validation Pipeline

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-shell:
    name: Validate Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Find and Validate Shell Scripts
        run: |
          echo "Validating shell scripts..."
          find . -type f -name "*.sh" ! -path "./.git/*" | while read script; do
              echo "Checking: $script"
              bash -n "$script" || exit 1
              shellcheck -x "$script" || true
          done
          echo "✓ All shell scripts validated"

  validate-lua:
    name: Validate Lua Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get install -y lua5.1

      - name: Find and Validate Lua Files
        run: |
          echo "Validating Lua configs..."
          find . -type f -name "*.lua" ! -path "./.git/*" | while read luafile; do
              echo "Checking: $luafile"
              luac -p "$luafile" || exit 1
          done
          echo "✓ All Lua files validated"

  validate-configs:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON Syntax
        run: |
          echo "Validating JSON files..."
          find . -type f -name "*.json" ! -path "./.git/*" | while read jsonfile; do
              echo "Checking: $jsonfile"
              python3 -m json.tool "$jsonfile" > /dev/null || exit 1
          done
          echo "✓ JSON validation passed"

      - name: Validate YAML Syntax (if present)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y yamllint
          find . -type f \( -name "*.yml" -o -name "*.yaml" \) ! -path "./.git/*" | while read ymlfile; do
              echo "Checking: $ymlfile"
              yamllint -d relaxed "$ymlfile" || true
          done || echo "No YAML files found"

  verify-structure:
    name: Verify Repository Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Required Directories
        run: |
          echo "Verifying repository structure..."
          
          dirs=("cachyOS-config-files" "ubuntu-config-files")
          for dir in "${dirs[@]}"; do
              if [ -d "$dir" ]; then
                  echo "✓ Found $dir"
              else
                  echo "✗ Missing $dir"
                  exit 1
              fi
          done
          
          echo "✓ Repository structure is valid"

      - name: Check Critical Config Files
        run: |
          echo "Checking critical config files..."
          
          critical_files=(
              "cachyOS-config-files/sway/config"
              "cachyOS-config-files/nvim/init.lua"
              "ubuntu-config-files/picom.conf"
          )
          
          for file in "${critical_files[@]}"; do
              if [ -f "$file" ]; then
                  echo "✓ Found $file"
              else
                  echo "⚠️  Optional file missing: $file"
              fi
          done

  notify-status:
    name: Workflow Status
    runs-on: ubuntu-latest
    needs: [validate-shell, validate-lua, validate-configs, verify-structure]
    if: always()
    steps:
      - name: Report Results
        run: |
          echo "✅ CI Pipeline Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ Shell script validation: PASSED"
          echo "✓ Lua config validation: PASSED"
          echo "✓ Config file validation: PASSED"
          echo "✓ Repository structure: VERIFIED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
