# ==============================================================================
# HYPRLOCK CONFIGURATION: MACOS SONOMA THEME
# ==============================================================================

# Smooth Fade-In and Fade-Out (Dissolve) Animations
animations {
    enabled = true
    animation = fadeIn, 1, 3.5, linear
    animation = fadeOut, 1, 3.5, linear
}

background {
    monitor =
    # path = /home/mocha/Pictures/saved-pictures/peakpx.jpg
    # path = /home/mocha/Pictures/saved-pictures/3.jpg
    path = /home/mocha/Pictures/saved-pictures/wallpaper3.jpg
    color = rgba(20, 20, 20, 1.0)
    blur_passes = 0
}

# ------------------------------------------------------------------------------
# TOP ANCHOR: DATE & TIME
# ------------------------------------------------------------------------------

# 1. Date (Above Time)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(255, 255, 255, 0.90)
    font_size = 20
    font_family = SF Pro Display Bold
    position = 0, -80
    halign = center
    valign = top
}

# 2. Big Time (24-Hour Military Format, Shadowless)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 110
    font_family = SF Pro Display Bold
    position = 0, -110
    halign = center
    valign = top
}

# ------------------------------------------------------------------------------
# BOTTOM ANCHOR: AVATAR, USERNAME, INPUT FIELD
# ------------------------------------------------------------------------------

# 3. User Avatar
image {
    monitor =
    path = /var/lib/AccountsService/icons/mocha
    size = 85
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.4)
    position = 0, 150
    halign = center
    valign = bottom
}

# 4. Username Label
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = SF Pro Display Bold
    position = 0, 115
    halign = center
    valign = bottom
}

# 5. Frosted Glass Input Field (macOS Pill)
input-field {
    monitor =
    size = 220, 36
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    rounding = -1
    inner_color = rgba(255, 255, 255, 0.20)
    outer_color = rgba(255, 255, 255, 0.35)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa" font_family="SF Pro Text">Enter Password</span>
    hide_input = false
    position = 0, 65
    halign = center
    valign = bottom
}
