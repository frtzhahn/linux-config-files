# ==============================================================================
# HYPRLOCK CONFIGURATION: MINIMALIST PILL THEME (REVIVED)
# ==============================================================================

# Smooth Fade-In and Fade-Out (Dissolve) Animations
animations {
    enabled = true
    animation = fadeIn, 1, 3.5, linear
    animation = fadeOut, 1, 3.5, linear
}

background {
    monitor =
    # path = /home/mocha/Pictures/saved-pictures/modern-rome-1758.jpg
    path = /home/mocha/Pictures/saved-pictures/2.jpg
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# 1. Primary Time Label (24-Hour Military Format)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(216, 240, 248, 1.0)
    font_size = 96
    font_family = FantasqueSansM Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# 2. Date Label
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 echo "$(date +'%a, %d %b')"
    color = rgba(216, 240, 248, 0.85)
    font_size = 18
    font_family = FantasqueSansM Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

# 3. Minimalist Black Pill Input Field
input-field {
    monitor =
    size = 220, 36
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    rounding = -1
    inner_color = rgba(255, 255, 255, 0.20)
    outer_color = rgba(255, 255, 255, 0.35)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa" font_family="FantasqueSansM Nerd Font">Enter Password</span>
    hide_input = false
    position = 0, -10
    halign = center
    valign = center
}

# 4. System Uptime & WakaTime Coding Metric (Option 3: Compact)
label {
    monitor =
    text = cmd[update:60000] UP=$(uptime -p | sed -e 's/up //' -e 's/ hours\?,/h/' -e 's/ hour\?,/h/' -e 's/ minutes\?/m/' -e 's/ minute\?/m/' -e 's/ days\?,/d/' -e 's/ day\?,/d/'); WAKA=$(wakatime-cli --today 2>/dev/null | sed -e 's/ hrs\?/h/' -e 's/ hr\?/h/' -e 's/ mins\?/m/' -e 's/ min\?/m/' || echo "0m"); echo "󰅒  Up $UP  •    $WAKA"
    color = rgba(216, 240, 248, 0.70)
    font_size = 12
    font_family = FantasqueSansM Nerd Font
    position = 0, 35
    halign = center
    valign = bottom
}
