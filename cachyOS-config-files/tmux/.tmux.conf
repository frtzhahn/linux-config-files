# =============================================================================
# 1. Prefix Configuration
# =============================================================================
# ctrl + space as prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# =============================================================================
# 2. Performance & Neovim Compatibility Settings
# =============================================================================
# Decrease escape-time delay (default is 500ms) to make Vim responsive
set -sg escape-time 10

# Increase scrollback history limit from 2000 to 50000
set -g history-limit 50000

# Enable focus-events for Neovim autoread support
set -g focus-events on

# Enable 24-bit True Color (RGB) support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:Ms=\\E]52;%p1%s;%p2%s\\7,xterm-256color:Tc"

# =============================================================================
# 3. Vim-style Pane Navigation (Alt + h/j/k/l)
# =============================================================================
# No prefix required to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# =============================================================================
# 4. Vim-style Window Navigation (Shift + Alt + H/L)
# =============================================================================
# No prefix required to cycle windows
bind -n M-H previous-window
bind -n M-L next-window

# =============================================================================
# 5. Vim-style Splits (v and h)
# =============================================================================
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'

# =============================================================================
# 6. Vim-style Resizing (Prefix + H/J/K/L)
# =============================================================================
bind -r H resize-pane -L 10
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 10

# =============================================================================
# 7. Copy Mode Settings (Vi keys & System Clipboard)
# =============================================================================
# Set vi mode keys
setw -g mode-keys vi

# Enable mouse for scrolling/clicking
set -g mouse on

# Neovim Visual Mode mapping in copy-mode-vi
# Enter copy mode with: Prefix + [
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# =============================================================================
# 8. Windows & Panes Options
# =============================================================================
# Start Windows and Panes numbering at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# =============================================================================
# 9. Aesthetic Border & Status Styling
# =============================================================================
# Style active and inactive pane borders
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=magenta

# Highlight current active window status tab
set -g window-status-current-style fg=magenta,bold

# =============================================================================
# 10. General Keybindings
# =============================================================================
# Quick Exit (Kill Pane without confirmation)
bind q kill-pane

# Easy Config Reload
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# =============================================================================
# 11. Tmux Plugin Manager (TPM)
# =============================================================================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Automatic restore on tmux server startup
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
