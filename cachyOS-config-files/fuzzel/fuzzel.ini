# fuzzel configuration
[main]
namespace=fuzzel
font=JetBrainsMono Nerd Font:size=7:weight=bold
icon-theme=candy-icons
width=55
lines=12
inner-pad=10
horizontal-pad=25
vertical-pad=10
image-size-ratio=0.9
terminal=kitty

# tokyo night theme
# [colors]
# background=1a1b26d9        # 85% opacity background
# text=c0caf5ff              # Main text
# match=7aa2f7ff             # Non-selected match highlights (blue)
# selection=7aa2f733         # Selected item highlight background (semi-transparent blue)
# selection-text=c0caf5ff    # Selected item text
# selection-match=7aa2f7ff   # Selected match highlights (blue)
# border=7aa2f7ff            # Glow border color (blue)

# gruvbox configuration
[colors]
background=282828d9     
text=ebdbb2ff           
match=458588ff         
selection=3c3836d9      
selection-text=fbf1c7ff 
selection-match=458588ff 
border=d79921ff         

